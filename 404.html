:root {
  --creme: #fbf7f1; --beige: #f4ece1; --text: #3b3128; --text-leise: #6b5d50; --gold: #b8955a; --gold-text: #7a5c2c;

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: grid; place-items: center; padding: 48px 16px;
  background: radial-gradient(ellipse at 50% 0%, var(--creme), var(--beige) 70%); color: var(--text);

main { max-width: 520px; }
.logo img { display: block; height: 64px; width: auto; margin: 0 auto 40px; }
.zahl { font: italic 400 clamp(88px, 22vw, 140px)/1 var(--serif); color: var(--gold-text); margin: 0; }
.zier { display: block; width: 180px; height: 14px; margin: 20px auto 28px; }
.zier line { stroke: var(--gold); stroke-width: 1; }

h1 { font: 400 clamp(28px, 5vw, 38px)/1.2 var(--serif); margin: 0 0 12px; }
p { color: var(--text-leise); margin: 0 0 32px; }
.knoepfe { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.knopf {
  display: inline-flex; align-items: center; min-height: 48px; padding: 0 26px; border-radius: 999px;
  font: 500 13px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; text-decoration: none; transition: background .3s, color .3s;
}
.voll { background: var(--text); color: var(--creme); }
.voll:hover { background: #2a221b; }
.linie { border: 1px solid var(--gold); color: var(--text); }
.linie:hover { background: rgba(184,149,90,.12); }
.englisch { margin: 40px 0 0; font-size: 14px; }
.englisch a { color: var(--gold-text); }
:focus-visible { outline: 2px solid var(--gold-text); outline-offset: 3px; }
</style>
